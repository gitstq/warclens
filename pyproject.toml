[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warclens"
version = "1.0.0"
description = "零依赖 WARC 归档解析与完整性取证工具箱 / Dependency-free WARC parsing & integrity forensics toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "WarcLens contributors" }]
keywords = ["warc", "archive", "forensics", "iso-28500", "parser", "integrity", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.scripts]
warclens = "warclens.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/warclens"
Issues = "https://github.com/gitstq/warclens/issues"

[tool.setuptools.packages.find]
include = ["warclens*"]

[tool.setuptools.package-data]
warclens = ["py.typed"]
